name: Run PDF Crawler

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt update
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
        shell: bash

      - name: Install matching ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          DRIVER_JSON=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json)
          DRIVER_VERSION=$(echo "$DRIVER_JSON" | grep -B1 "$CHROME_VERSION" | grep '"version"' | head -1 | cut -d '"' -f4)

          if [ -z "$DRIVER_VERSION" ]; then
            echo "Failed to detect compatible ChromeDriver version"
            exit 1
          fi

          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/$DRIVER_VERSION/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
        shell: bash

      - name: Run crawler script
        run: python manicrawl.py

      - name: Upload PDF results
        uses: actions/upload-artifact@v4
        with:
          name: pdf-results
          path: pdf_results/
